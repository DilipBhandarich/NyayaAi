version: "3.9"

services:
  # MongoDB - single node replica set for Atlas Vector Search compatibility
  mongodb:
    image: mongo:7
    container_name: nyaya_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: >
        echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) }" | mongosh --quiet
      interval: 10s
      timeout: 10s
      retries: 5

  # Express.js Backend
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nyaya_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/nyaya_ai?replicaSet=rs0
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: http://localhost:3000
    volumes:
      - upload_data:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy

  # Vite + React Frontend (served via nginx in production)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: nyaya_client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  mongo_data:
  upload_data:
